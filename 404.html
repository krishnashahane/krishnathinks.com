<script>
// the buttons work wherever the site lives: at the root of a domain, in a subfolder, or opened as files
(() => {
  const here = location.pathname, i = here.lastIndexOf('/404');

<script>
// "404" drawn in dots. Each dot is pushed away by the pointer and springs back to its place.
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, pts = [], col = '232,228,224';
  const ptr = { x: -9999, y: -9999, vx: 0, vy: 0, on: false };
  function build(){
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    col = getComputedStyle(document.documentElement).getPropertyValue('--fg-rgb').trim() || col;
    // render the number off-screen, then sample it on a grid
    const mob = W < 640, fs = Math.min(W * (mob ? .42 : .34), H * .46);
    const gap = Math.max(5, Math.round(fs / (mob ? 30 : 42)));
    const o = document.createElement('canvas'); o.width = W; o.height = H;
    const g = o.getContext('2d');
    g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `800 ${fs}px Onest, system-ui, sans-serif`;
    g.fillText('404', W / 2, H * (mob ? .4 : .44));
    const d = g.getImageData(0, 0, W, H).data;
    pts = [];
    for (let y = 0; y < H; y += gap) for (let x = 0; x < W; x += gap){
      if (d[(y * W + x) * 4 + 3] > 128) pts.push({ hx: x, hy: y, x, y, vx: 0, vy: 0, r: gap * .3 });
    }
    // fly in from scattered positions the first time
    if (!build.done && !reduced){ build.done = true; for (const p of pts){ p.x = p.hx + (Math.random() - .5) * W * .6; p.y = p.hy + (Math.random() - .5) * H * .6; } }
  }
  const R = () => Math.max(70, Math.min(W, H) * .13);
  function frame(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const rad = R(), r2 = rad * rad;
    ctx.fillStyle = `rgba(${col},.82)`; ctx.beginPath();
    for (const p of pts){
      const dx = p.x - ptr.x, dy = p.y - ptr.y, dd = dx * dx + dy * dy;
      if (ptr.on && dd < r2){
        const dist = Math.sqrt(dd) || 1, f = (1 - dist / rad);
        // pushed outward, and dragged a little along with the pointer's movement
        p.vx += (dx / dist) * f * 6 + ptr.vx * f * .25;
        p.vy += (dy / dist) * f * 6 + ptr.vy * f * .25;
      }
      p.vx += (p.hx - p.x) * .045; p.vy += (p.hy - p.y) * .045;     // spring home
      p.vx *= .86; p.vy *= .86;
      p.x += p.vx; p.y += p.vy;
      ctx.moveTo(p.x + p.r, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    }
    ctx.fill();
    ptr.vx *= .8; ptr.vy *= .8;
    requestAnimationFrame(frame);
  }
  const move = (x, y) => { if (ptr.on){ ptr.vx = x - ptr.x; ptr.vy = y - ptr.y; } ptr.x = x; ptr.y = y; ptr.on = true; };
  addEventListener('pointermove', e => move(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', e => move(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerleave', () => { ptr.on = false; });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') ptr.on = false; });
  addEventListener('resize', () => { clearTimeout(build.t); build.t = setTimeout(build, 120); });
  build(); document.fonts?.ready.then(build);
  if (reduced){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = `rgba(${col},.82)`; for (const p of pts){ ctx.beginPath(); ctx.arc(p.hx, p.hy, p.r, 0, Math.PI * 2); ctx.fill(); } }
  else requestAnimationFrame(frame);
})();
